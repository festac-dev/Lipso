<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#234b3b">
  <meta name="description" content="Connect your documents, commitments, time, and money in one private workspace. Every finding has a source. Every plan can be questioned.">
  <title>Lipso · A clearer picture</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="Workspace navigation" tabindex="-1">
    <div class="sidebar-header"><a class="brand" href="#overview" data-action="overview"><img src="/icon.svg" alt="" width="37" height="37"><span>Lipso<span class="brand-dot">.</span></span></a><button class="icon-button sidebar-close" type="button" data-action="close-menu" aria-label="Close navigation"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <div class="sidebar-scroll">
    <div class="workspace-label"><span class="workspace-avatar">L</span><span>My workspace<small>Personal</small></span></div>
    <p class="nav-label">WORKSPACE</p>
    <nav id="navigation"></nav>
    <div class="collections-heading"><span class="nav-label">COLLECTIONS</span><button class="icon-button" data-action="import" aria-label="Add a document to a collection">+</button></div>
    <div id="collections"></div>
    </div>
    <div class="sidebar-bottom"><div class="local-indicator"><span class="status-dot"></span>Locally yours</div><p>Documents, decisions, and data.</p><button class="sidebar-export" data-action="export">Export workspace <span>↗</span></button></div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div class="breadcrumbs"><button class="icon-button mobile-menu" data-action="menu" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">☰</button><span>Workspace</span><span class="slash">/</span><strong id="page-name">Overview</strong></div><div class="topbar-actions"><button class="quick-search" data-action="focus-search"><span>Search anything</span><kbd>⌘ K</kbd></button><button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><svg class="icon theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13.1A9 9 0 0 1 10.9 3.2 9 9 0 1 0 20.8 13.1Z"/></svg><svg class="icon theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button class="icon-button" data-action="about" aria-label="About Lipso">?</button><span class="profile-avatar" aria-label="Local workspace">L</span></div></header>
    <main id="main" tabindex="-1"><div class="loading-state">Opening your workspace…</div></main>
    <footer class="footer"><span>Less scattered. More certain.</span><span>Lipso / Local workspace <span class="status-dot"></span></span></footer>
  </div>
  <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
  <dialog id="document-dialog" class="document-dialog"><div id="document-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Lipso needs JavaScript to display the local workspace. Your documents remain in the local database.</p></noscript>
</body>
</html>
