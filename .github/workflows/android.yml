name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'lipso/**', 'web/**', 'requirements.txt', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Python regression tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -q
      - name: Build APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest lintRelease
      - name: Upload unsigned release for signing
        uses: actions/upload-artifact@v4
        with:
          name: lipso-unsigned-release
          path: android/app/build/outputs/apk/release/*-unsigned.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            ./android/gradlew -p android --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/dev.festac.lipso/files/screenshots android/app/build/android-screenshots
      - name: Upload Android checks and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lipso-android-checks
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/app/build/android-screenshots/
